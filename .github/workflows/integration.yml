---
name: integration tests

on:
  pull_request_target:
    branches:
      - devel
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

env:
  PY_COLORS: '1'
  ANSIBLE_FORCE_COLOR: '1'
jobs:
  integration:
    name: integration (${{ matrix.connection_mode }})
    runs-on: ubuntu-latest
    environment: CI
    env:
      HEADLESS: "yes"
    if: ${{ !github.event.pull_request || contains(github.event.pull_request.labels.*.name, 'safe to test') }}

    strategy:
      fail-fast: false
      matrix:
        connection_mode:
          - local
          - http-direct
          - http-persistent

    steps:
      # Required for fork PRs under pull_request_target; gated by "safe to test" label.
      - uses: actions/checkout@v3
        with:
          path: ansible-platform
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true

      - name: Checkout aap-gateway (use a branch is specified) and optionally DAB
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ secrets.AAP_GATEWAY_REPO_TOKEN }}
          GH_WORKSPACE: ${{ github.workspace }}
        run: tools/scripts/get_aap_gateway_and_dab.py
        working-directory: ansible-platform

      - name: Expose collection checkout to aap-gateway build
        run: ln -s "${{ github.workspace }}/ansible-platform" "${{ github.workspace }}/aap-gateway/ansible.platform"

      - name: Install podman-compose
        run: pip3 install 'podman-compose>=1.6.0'

      - name: Build the image
        run: make docker-compose-build
        working-directory: aap-gateway

      - name: Spin up the dev env
        run: |
          ansible-playbook -v tools/ansible/smoke-test-no-services.yml \
            -e repo_root=$(pwd) \
            -e gateway_vars=$(readlink -f container-startup.yml)
        working-directory: aap-gateway

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install integration controller requirements
        run: pip install -r tests/integration/requirements.txt ansible-core
        working-directory: ansible-platform

      - name: Start controller service
        run: |
          AAP_GATEWAY_DIR=${{ github.workspace }}/aap-gateway \
            ./tools/controller-dev-env/setup.sh
        working-directory: ansible-platform

      - name: Extract gateway password and set it as an environment variable
        run: |
          ADMIN_PW=$(awk '/gateway_admin_password/{print $2}' container-startup.yml | xargs echo) &&
            echo "GATEWAY_PASSWORD=$ADMIN_PW" >> $GITHUB_ENV
        working-directory: aap-gateway

      - name: Wait for envoy xDS refresh
        run: sleep 65

      - name: Debug — container status
        if: always()
        run: |
          echo "=== Running containers ==="
          podman ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          echo ""
          echo "=== AWX controller health ==="
          curl -sf http://localhost:8013/api/controller/v2/ping/ && echo "  Direct AWX: OK" || echo "  Direct AWX: FAILED"
          echo ""
          echo "=== Gateway health ==="
          curl -sf -k https://localhost:8443/api/gateway/v1/ping/ && echo "  Gateway (8443): OK" || echo "  Gateway (8443): FAILED"
          curl -sf -k https://localhost:8000/api/gateway/v1/ping/ && echo "  Gateway (8000): OK" || echo "  Gateway (8000): FAILED"

      - name: Debug — envoy clusters
        if: always()
        run: |
          echo "=== Envoy clusters ==="
          curl -sf http://localhost:19000/clusters 2>/dev/null || echo "Envoy admin not reachable on 19000"
          echo ""
          echo "=== Grep for controller in clusters ==="
          curl -sf http://localhost:19000/clusters 2>/dev/null | grep -i controller || echo "  No controller cluster found"

      - name: Debug — envoy routes (config_dump)
        if: always()
        run: |
          echo "=== Envoy route config (filtered for controller) ==="
          curl -sf http://localhost:19000/config_dump 2>/dev/null | \
            python3 -c "
          import json, sys
          try:
              dump = json.load(sys.stdin)
              for config in dump.get('configs', []):
                  if '@type' in config and 'route' in config.get('@type', '').lower():
                      print(json.dumps(config, indent=2))
                  for entry in config.get('dynamic_route_configs', config.get('static_route_configs', [])):
                      rc = entry.get('route_config', {})
                      for vh in rc.get('virtual_hosts', []):
                          for route in vh.get('routes', []):
                              match = route.get('match', {})
                              route_action = route.get('route', {})
                              prefix = match.get('prefix', '')
                              cluster = route_action.get('cluster', '')
                              if 'controller' in prefix.lower() or 'controller' in cluster.lower():
                                  print(f'MATCH: prefix={prefix} -> cluster={cluster}')
              print('--- done scanning routes ---')
          except Exception as e:
              print(f'Error parsing config_dump: {e}')
          " 2>&1 || echo "Could not parse envoy config"

      - name: Debug — envoy listeners
        if: always()
        run: |
          echo "=== Envoy listeners ==="
          curl -sf http://localhost:19000/listeners 2>/dev/null || echo "Envoy admin not reachable"

      - name: Debug — gateway services API
        if: always()
        run: |
          GW="https://localhost:8000"
          echo "=== Registered services ==="
          curl -sk -u admin:$GATEWAY_PASSWORD \
            $GW/api/gateway/v1/services/ 2>/dev/null | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for svc in data.get('results', []):
              print(f\"  {svc.get('name','?'):20s} slug={svc.get('api_slug','?'):15s} port={svc.get('service_port','?')} https={svc.get('is_service_https','?')}\")
          " 2>&1 || echo "Could not query services API"
          echo ""
          echo "=== HTTP ports ==="
          curl -sk -u admin:$GATEWAY_PASSWORD \
            $GW/api/gateway/v1/http_ports/ 2>/dev/null | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for p in data.get('results', []):
              print(f\"  id={p.get('id','?')} name={p.get('name','?'):15s} number={p.get('number','?')} https={p.get('use_https','?')} is_api={p.get('is_api_port','?')}\")
          " 2>&1 || echo "Could not query http_ports API"
          echo ""
          echo "=== Service nodes ==="
          curl -sk -u admin:$GATEWAY_PASSWORD \
            $GW/api/gateway/v1/service_nodes/ 2>/dev/null | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for node in data.get('results', []):
              print(f\"  {node.get('name','?'):20s} address={node.get('address','?'):25s} port={node.get('port','?')} service={node.get('service','?')}\")
          " 2>&1 || echo "Could not query service_nodes API"
          echo ""
          echo "=== Service clusters ==="
          curl -sk -u admin:$GATEWAY_PASSWORD \
            $GW/api/gateway/v1/service_clusters/ 2>/dev/null | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for cl in data.get('results', []):
              print(f\"  {cl.get('name','?'):20s} id={cl.get('id','?')}\")
          " 2>&1 || echo "Could not query service_clusters API"
          echo ""
          echo "=== Routes ==="
          curl -sk -u admin:$GATEWAY_PASSWORD \
            $GW/api/gateway/v1/routes/ 2>/dev/null | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for r in data.get('results', []):
              print(f\"  {r.get('name','?'):30s} path={r.get('gateway_path','?'):20s} cluster={r.get('service_cluster','?')} port={r.get('service_port','?')}\")
          " 2>&1 || echo "Could not query routes API"

      - name: Debug — xDS LDS endpoint (direct POST like envoy)
        if: always()
        run: |
          echo "=== POST to LDS endpoint (like envoy does) ==="
          curl -sk -X POST \
            -H "Content-Type: application/json" \
            -d '{"node":{"id":"debug"},"resource_names":["*"]}' \
            https://localhost:8000/v3/discovery:listeners 2>&1
          echo ""
          echo "=== POST to CDS endpoint (like envoy does) ==="
          curl -sk -X POST \
            -H "Content-Type: application/json" \
            -d '{"node":{"id":"debug"},"resource_names":["*"]}' \
            https://localhost:8000/v3/discovery:clusters 2>&1

      - name: Debug — envoy container logs
        if: always()
        run: |
          echo "=== Envoy proxy container logs (last 80 lines) ==="
          podman logs --tail 80 aap_gw_proxy1 2>&1 || echo "No envoy container logs"

      - name: Debug — gateway container logs (xDS related)
        if: always()
        run: |
          echo "=== Gateway logs (xDS/envoy/listener related, last 100 lines) ==="
          podman logs --tail 500 aap_gw_1 2>&1 | grep -iE "xds|envoy|listener|discovery|lds|cds|error|exception|traceback" | tail -100 || echo "No relevant gateway logs"

      - name: Debug — proxy routing test
        if: always()
        run: |
          echo "=== Gateway -> Controller proxy test ==="
          echo "--- via HAProxy (8443) ---"
          curl -vsk -u admin:$GATEWAY_PASSWORD \
            https://localhost:8443/api/controller/v2/ping/ 2>&1 | head -40
          echo ""
          echo "--- via gateway direct (8000) ---"
          curl -vsk -u admin:$GATEWAY_PASSWORD \
            https://localhost:8000/api/controller/v2/ping/ 2>&1 | head -40
          echo ""
          echo "--- via envoy (9080) ---"
          curl -vs http://localhost:9080/api/controller/v2/ping/ 2>&1 | head -40

      - name: Debug — AWX container logs (last 50 lines)
        if: always()
        run: podman logs --tail 50 awx_controller 2>&1 || echo "No AWX container logs"

      - name: Perform integration tests (${{ matrix.connection_mode }})
        env:
          ANSIBLE_TEST_INTEGRATION_NO_VENV: '1'
        run: make collection-test CONNECTION_MODE=${{ matrix.connection_mode }}
        working-directory: ansible-platform

      - name: Dump the container logs on failure
        run: podman-compose -f tools/generated/compose.yml logs
        working-directory: aap-gateway
        if: failure()

      - name: Dump controller logs on failure
        run: podman logs awx_controller 2>&1 || true
        if: failure()

  coverage_test:
    name: collection integration check
    runs-on: ubuntu-latest
    environment: CI
    env:
      HEADLESS: "yes"
    if: ${{ !github.event.pull_request || contains(github.event.pull_request.labels.*.name, 'safe to test') }}
    steps:
      # Required for fork PRs under pull_request_target; gated by "safe to test" label.
      - uses: actions/checkout@v3
        with:
          path: ansible-platform
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true

      - name: Checkout aap-gateway (use a branch is specified) and optionally DAB
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ secrets.AAP_GATEWAY_REPO_TOKEN }}
          GH_WORKSPACE: ${{ github.workspace }}
        run: tools/scripts/get_aap_gateway_and_dab.py
        working-directory: ansible-platform

      - name: Expose collection checkout to aap-gateway build
        run: ln -s "${{ github.workspace }}/ansible-platform" "${{ github.workspace }}/aap-gateway/ansible.platform"

      - name: Install make
        run: sudo apt install make

      - name: Install python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install requirements
        run: pip3.11 install -r requirements/requirements_dev.txt ansible-core
        working-directory: ansible-platform

      - name: Install podman-compose
        run: pip3 install 'podman-compose>=1.6.0'

      - name: Start the dev environment
        run: COMPOSE_UP_OPTS='-d' make docker-compose
        working-directory: aap-gateway

      - name: Perform completeness tests
        run: make collection-test-integration-check
        working-directory: ansible-platform

  completeness_test:
    name: collection completeness test
    runs-on: ubuntu-latest
    environment: CI
    env:
      HEADLESS: "yes"
    if: ${{ !github.event.pull_request || contains(github.event.pull_request.labels.*.name, 'safe to test') }}
    steps:
      # Required for fork PRs under pull_request_target; gated by "safe to test" label.
      - uses: actions/checkout@v3
        with:
          path: ansible-platform
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true

      - name: Checkout aap-gateway (use a branch is specified) and optionally DAB
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ secrets.AAP_GATEWAY_REPO_TOKEN }}
          GH_WORKSPACE: ${{ github.workspace }}
        run: tools/scripts/get_aap_gateway_and_dab.py
        working-directory: ansible-platform

      - name: Expose collection checkout to aap-gateway build
        run: ln -s "${{ github.workspace }}/ansible-platform" "${{ github.workspace }}/aap-gateway/ansible.platform"

      - name: Install make
        run: sudo apt install make

      - name: Install python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install requirements
        run: pip3.11 install -r requirements/requirements_dev.txt ansible-core
        working-directory: ansible-platform

      - name: Install podman-compose
        run: pip3 install 'podman-compose>=1.6.0'

      - name: Start the dev environment
        run: COMPOSE_UP_OPTS='-d' make docker-compose
        working-directory: aap-gateway

      - name: Extract gateway password and set it as an environment variable
        run: |
          ADMIN_PW=$(awk '/gateway_admin_password/{print $2}' container-startup.yml | xargs echo) &&
            echo "GATEWAY_PASSWORD=$ADMIN_PW" >> $GITHUB_ENV
        working-directory: aap-gateway

      - name: Copy container-startup.yml to ../ansible-platform (required by the test script)
        run: |
          cp container-startup.yml $GITHUB_WORKSPACE
        working-directory: aap-gateway

      - name: Perform completeness tests
        run: make collection-test-completeness
        working-directory: ansible-platform
...
